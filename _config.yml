# Site-wide settings
# ------------------
title: HuyNotes
author:
  name: Huy Pham
  # email: keixi512@gmail.com
description: > # this means to ignore newlines until the next key
  My Learning Curve

google_analytics: G-07SWM60HFL


# Build settings
# --------------
#
# If you clone the Minima repo and build locally, use this setting.
# theme: minima
#
# As of November 2023, GitHub Pages still uses Minima 2.5.1 (https://pages.github.com/versions/).
# If you want to use the latest Minima version on GitHub Pages, use the following setting and
# add a line comment on "theme: minima" above.
remote_theme: jekyll/minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Theme demo posts inherited from jekyll/minima. Excluded rather than deleted so
# the files stay identical to upstream and merges from it remain conflict-free.
exclude:
  - _posts/2016-05-19-codeblocks-ahoy.md
  - _posts/2016-05-19-super-short-article.md
  - _posts/2016-05-20-my-example-post.md
  - _posts/2016-05-20-super-long-article.md
  - _posts/2016-05-20-this-post-demonstrates-post-content-styles.md
  - _posts/2016-05-20-welcome-to-jekyll.md


# Minima-specific settings (Minima v3 and above)
# ----------------------------------------------
minima:
  # Available skins: classic, dark, auto, solarized-light, solarized-dark, solarized
  # skin: auto

  # Minima date format
  # refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
  date_format: "%b %-d, %Y"

  # If you want to link only specific pages in your header, uncomment
  # this and add the path to the pages in order as they should show up
  # nav_pages:
  #   - about.md

  # Set to `true` to show excerpts on the homepage.
  show_excerpts: false

  # Social Media Links.
  # Rendered via Font Awesome Free webfonts CDN. Valid entry keys:
  #   * title    Tooltip rendered on hovering over icon.
  #   * icon     Font Awesome icon id. `github` corresponds to `fa-github`.
  #   * url      Full URL of social profile.
  social_links:
    - title: Huy Pham at GitHub
      icon: github
      url: "https://github.com/pnhuy/"
    - title: Huy Pham at LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/huynp/"

  # Set to `true` to not render the syndication feed link in the social-links list.
  # hide_site_feed_link: false


disqus:
  # Leave shortname blank to disable comments site-wide.
  # Disable comments for any post by adding `comments: false` to that post's YAML Front Matter.
  shortname: huynp
